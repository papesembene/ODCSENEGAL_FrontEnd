<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ff7900">
  <title>Service temporairement indisponible | ODC Sénégal</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      padding: 24px; color: #252525; background: #f7f7f7;
    }
    main {
      width: min(100%, 560px); padding: clamp(28px, 7vw, 56px);
      text-align: center; background: #fff; border: 1px solid #e8e8e8;
      border-radius: 20px; box-shadow: 0 16px 48px rgb(0 0 0 / 7%);
    }
    .brand { margin: 0 0 34px; color: #f16e00; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    .mark {
      width: 54px; height: 6px; margin: 0 auto 24px; border-radius: 99px;
      background: #ff7900;
    }
    h1 { margin: 0 0 14px; font-size: clamp(26px, 6vw, 34px); line-height: 1.2; }
    p { margin: 0; color: #555; font-size: 16px; line-height: 1.65; }
    a {
      display: inline-block; margin-top: 28px; padding: 13px 22px;
      color: #fff; background: #f16e00; border-radius: 8px;
      font-size: 15px; font-weight: 700; text-decoration: none;
    }
    a:hover { background: #d95f00; }
    a:focus-visible { outline: 3px solid #252525; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">ORANGE DIGITAL CENTER SÉNÉGAL</p>
    <div class="mark" aria-hidden="true"></div>
    <h1>Service temporairement indisponible</h1>
    <p>Nous rencontrons un problème technique. Veuillez réessayer dans quelques instants.</p>
    <a href="https://orangedigitalcenter.sn/">Retour à l’accueil</a>
  </main>
</body>
</html>
